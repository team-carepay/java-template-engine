name: CI

on:
  push:
    branches-ignore: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
          # Replaces the hand-rolled actions/cache step: setup-java caches
          # ~/.gradle itself and keys it off the Gradle files.
          cache: gradle
      - name: Build with Gradle
        run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: Package
          path: build/libs
