name: Release

on:
  push:
    branches:
      - master

jobs:
  build:
    if: "!contains(github.event.commits[0].message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Setup git user CarePay bot
        run: |
          git config user.name "CarePay bot"
          git config user.email "infra-team@carepay.com"
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle
      - run: ./gradlew release
