default_install_hook_types: [ pre-commit, commit-msg ]
default_stages: [ pre-commit ]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [ --branch, master ]
      - id: detect-aws-credentials
        args: [ --allow-missing-credentials ]
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-yaml
        args: [ --allow-multiple-documents ]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # keep markdown hard line breaks (two trailing spaces)
        args: [ "--markdown-linebreak-ext=md,mdx" ]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # No checkstyle here on purpose: this repo is a fork of an upstream project
  # (package ru.proninyaroslav.template) and its vendored source has ~90
  # violations of the CarePay style. Linting it would block any commit that
  # touches upstream code. Same reasoning as system-user-controller.
  - repo: https://github.com/team-carepay/pre-commit-hooks
    rev: v2.1.0
    hooks:
      - id: check-jira-issue
        args: [ --host, carepay.atlassian.net ]
      - id: append-jira-issue
